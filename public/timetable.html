<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TimeTable</title>
</head>
<body>
    <h1>TimeTable View</h1>

    <select id="teacherSelect">
        <option value="">Select Teacher</option>
    </select>

    <button id="loadTimetable">Load Timetable</button>

    <table border="1">
        <thead>
            <tr>
                <td>Day</td>
                <td>Time</td>
                <td>Subject</td>
                <td>Teacher</td>
                <td>Room</td>
                <td>Group</td>
            </tr>
        </thead>
        <tbody id="output">

        </tbody>
    </table>
    <script src="js/timetable.js"></script>
</body>
</html>
